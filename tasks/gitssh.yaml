---
- name: Create private SSH directory
  ansible.builtin.file:
    path: "{{ home }}/.ssh"
    state: directory
    mode: '0700'

- name: Restore vaulted private key with backup of any previous identity
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/ssh/id_rsa"
    dest: "{{ home }}/.ssh/id_rsa"
    mode: '0600'
    backup: true
  no_log: true

- name: Restore matching public key
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/ssh/id_rsa.pub"
    dest: "{{ home }}/.ssh/id_rsa.pub"
    mode: '0644'
    backup: true

- name: Read rice repository push URL
  ansible.builtin.command:
    argv: [git, -C, "{{ playbook_dir }}", remote, get-url, --push, origin]
  register: rice_push_url
  changed_when: false

- name: Configure rice repository SSH pushes
  ansible.builtin.command:
    argv: [git, -C, "{{ playbook_dir }}", remote, set-url, --push, origin, 'git@github.com:crlxs/rice.git']
  when: rice_push_url.stdout != 'git@github.com:crlxs/rice.git'
