---
- name: Install core packages
  ansible.builtin.apt:
    name: "{{ core_packages }}"
    state: present
  become: true

- name: Relocate legacy bare dotfiles repository without changing its contents
  ansible.builtin.script:
    cmd: '{{ (playbook_dir ~ "/files/migrate_home.py") | quote }} {{ home | quote }} --repository-only'
    executable: /usr/bin/python3
  register: repository_migration
  changed_when: "'CHANGED:' in repository_migration.stdout"

- name: Clone dotfiles without overwriting or updating an existing repository
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ dotfiles_directory }}"
    bare: true
    update: false

- name: Back up initial dotfile conflicts and check out configuration
  ansible.builtin.script:
    cmd: '{{ (playbook_dir ~ "/files/checkout_dotfiles.py") | quote }} {{ home | quote }} {{ dotfiles_directory | quote }}'
    executable: /usr/bin/python3
  register: dotfiles_checkout
  changed_when: "'CHANGED' in dotfiles_checkout.stdout"

- name: Hide untracked home files from dotfiles status
  ansible.builtin.command:
    argv: [git, "--git-dir={{ dotfiles_directory }}", config, --local, status.showUntrackedFiles, 'no']
  changed_when: false

- name: Configure authenticated pushes without changing HTTPS fetches
  ansible.builtin.command:
    argv: [git, "--git-dir={{ dotfiles_directory }}", remote, set-url, --push, origin, "{{ dotfiles_push_url }}"]
  changed_when: false

- name: Migrate managed legacy files into data, state and cache directories
  ansible.builtin.script:
    cmd: '{{ (playbook_dir ~ "/files/migrate_home.py") | quote }} {{ home | quote }}'
    executable: /usr/bin/python3
  register: home_migration
  changed_when: "'CHANGED:' in home_migration.stdout"

- name: Download checksum-verified Neovim archive
  ansible.builtin.get_url:
    url: "{{ nvim_release_url }}/{{ nvim_asset }}"
    dest: "{{ home }}/.cache/{{ nvim_version }}-{{ nvim_asset }}"
    checksum: "sha256:{{ nvim_checksums[nvim_arch] }}"
    mode: '0644'

- name: Create versioned Neovim directory
  ansible.builtin.file:
    path: "{{ nvim_directory }}"
    state: directory
    mode: '0755'

- name: Extract Neovim without requiring FUSE
  ansible.builtin.unarchive:
    src: "{{ home }}/.cache/{{ nvim_version }}-{{ nvim_asset }}"
    dest: "{{ nvim_directory }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ nvim_directory }}/bin/nvim"

- name: Link Neovim into the user path
  ansible.builtin.file:
    src: "{{ nvim_directory }}/bin/nvim"
    dest: "{{ home }}/.local/bin/nvim"
    state: link
    force: true

- name: Verify Neovim can start
  ansible.builtin.command:
    argv: ["{{ home }}/.local/bin/nvim", --version]
  changed_when: false
  when: not ansible_check_mode

- name: Set the desktop user's login shell
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    shell: /bin/zsh
  become: true
